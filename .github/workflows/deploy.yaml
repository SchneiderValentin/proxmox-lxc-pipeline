name: Dynamic Proxmox LXC Deployment

on:
  push: # Security notice - self-hosted + public: no pull request triggers! 
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-infrastructure:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python virtual environment
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "ANSIBLE_COLLECTIONS_PATH=$RUNNER_TEMP/ansible-collections" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          pip install \
            "ansible-core==2.17.*" \
            "proxmoxer==2.3.0" \
            "requests==2.31.0"

      - name: Install Ansible dependencies
        run: |
          ansible-galaxy collection install \
            "community.proxmox==1.5.0" \
            -p "$RUNNER_TEMP/ansible-collections"

      - name: Deploy LXC
        env:
          PROXMOX_PASSWORD: ${{ secrets.PROXMOX_API_PASSWORD }}
          LXC_PASSWORD: ${{ secrets.LXC_ROOT_PASSWORD }}
        run: |
          ansible-playbook -i inventory.yaml deploy_lxc.yaml \
            -e "proxmox_password=$PROXMOX_PASSWORD" \
            -e "lxc_password=$LXC_PASSWORD"