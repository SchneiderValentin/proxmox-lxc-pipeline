---
- name: Deploy LXC Cluster
  hosts: runner
  gather_facts: false

  vars:
    proxmox_host: "10.254.0.1"
    proxmox_user: "root@pam"
    node_name: "pve"

    # Shared Network Config
    lxc_bridge: "vmbr88"
    lxc_cidr: "24"
    lxc_gw: "10.254.0.1"

  tasks:
    - name: Create LXC cluster
      community.proxmox.proxmox:
        api_host: "{{ proxmox_host }}"
        api_user: "{{ proxmox_user }}"
        api_password: "{{ proxmox_password }}"
        validate_certs: false   # Disabled because Proxmox uses self-signed certificates in the local testbed
        node: "{{ node_name }}"
        vmid: "{{ hostvars[item].vmid }}"
        hostname: "{{ item }}"
        password: "{{ lxc_password }}"
        pubkey: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"   # Inject SSH key
        ostemplate: "local:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst"
        storage: "local-lvm"
        memory: 512
        disk: 8
        netif: '{"net0":"name=eth0,ip={{ hostvars[item].ansible_host }}/{{ lxc_cidr }},gw={{ lxc_gw }},bridge={{ lxc_bridge }}"}'
        unprivileged: true
        features:
          - nesting=1           # For container extensions
        update: false
        state: present
      loop: "{{ groups['lxc_nodes'] }}"

    - name: Start LXC cluster
      community.proxmox.proxmox:
        api_host: "{{ proxmox_host }}"
        api_user: "{{ proxmox_user }}"
        api_password: "{{ proxmox_password }}"
        validate_certs: false
        node: "{{ node_name }}"
        vmid: "{{ hostvars[item].vmid }}"
        hostname: "{{ item }}"  # Prevents race condition "Key Error: 'name'" on fresh LXCs
        state: started
      loop: "{{ groups['lxc_nodes'] }}"

- name: Verify SSH access
  hosts: lxc_nodes
  gather_facts: false

  tasks:
    - name: Wait for SSH login
      ansible.builtin.wait_for_connection:
        timeout: 30