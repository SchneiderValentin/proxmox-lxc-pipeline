---
all:
  hosts:
    runner:
      ansible_connection: local

  children:
    lxc_nodes:

      vars:
        ansible_user: root
        # Disabled for IP reuse across pipeline builds at local bridge
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
        ansible_python_interpreter: /usr/bin/python3

      hosts:
        load-balancer:
          ansible_host: 10.254.0.90
          vmid: 990
        app-1:
          ansible_host: 10.254.0.91
          vmid: 991
        app-2:
          ansible_host: 10.254.0.92
          vmid: 992